name: test
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Race-suite stability (three active-racer repetitions)
        run: npm run test:race
      - name: Mutation quality floor
        run: npm run test:mutation
      - name: Deterministic audit profile
        run: npm run audit
      - name: ShellCheck runtime, developer, and rig scripts
        run: |
          shellcheck --version
          shellcheck --severity=warning bin/loose-ends-scan scripts/*.sh e2e/*.sh .githooks/pre-push
